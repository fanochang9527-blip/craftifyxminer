services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      # PG 18+ 官方镜像建议挂载 /var/lib/postgresql（非 .../data）
      - pgdata:/var/lib/postgresql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/indexes.sql:/docker-entrypoint-initdb.d/02-indexes.sql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-craftifyx_miner}
      POSTGRES_USER: ${POSTGRES_USER:-miner}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: .
    command: gunicorn -w 2 -b 0.0.0.0:5000 server.app:app
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env

  cron:
    build: .
    command: python -m cron.daily_job
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_started
    env_file: .env

volumes:
  pgdata:

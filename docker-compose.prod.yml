services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      server:
        condition: service_healthy
      dashboard:
        condition: service_healthy

  server:
    build: .
    command: >
      gunicorn -w 2 -b 0.0.0.0:5000
      --access-logfile /app/logs/gunicorn-access.log
      --error-logfile /app/logs/gunicorn-error.log
      server.app:app
    restart: unless-stopped
    expose:
      - "5000"
    env_file: .env
    volumes:
      - app_logs:/app/logs
      - model_data:/app/models
      # 种子文件放宿主机项目目录 data/（.gitignore），导入时容器内路径为 /app/data/…
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false
    restart: unless-stopped
    expose:
      - "8501"
    env_file: .env
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  cron:
    build: .
    command: python -m cron.daily_job
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    env_file: .env
    volumes:
      - app_logs:/app/logs
      - model_data:/app/models

volumes:
  nginx_logs:
  app_logs:
  model_data:

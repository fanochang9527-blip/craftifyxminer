# BIO 知识库 — Level 1/2 规则快筛
# 基于数百名已验证创作者的 BIO 特征提取
# Level 1: Link DNA 指纹 (出现即 95%+ 为创作者)
# Level 2: 语义矩阵 (身份/动作/工具关键词 + Emoji 信号)

# === Level 1: Link DNA 指纹 ===
link_dna:
  high_confidence:
    - "linktr.ee"
    - "linktree.com"
    - "carrd.co"
    - "carrd.me"
    - "artstation.com"
    - "pixiv.net"
    - "pixiv.me"
    - "booth.pm"
    - "vgen.co"
    - "vgen.ai"
    - "toyhou.se"
    - "deviantart.com"
    - "etsy.com/shop"
    - "gumroad.com"
    - "ko-fi.com"
    - "patreon.com"
  medium_confidence:
    - "twitch.tv"
    - "youtube.com/@"
    - "instagram.com/"

# === Level 2: 语义矩阵 ===
semantic_matrix:
  identity_keywords:
    en:
      - "illustrator"
      - "artist"
      - "artisan"
      - "character designer"
      - "character creator"
      - "fanartist"
      - "plush artist"
      - "doll maker"
      - "game dev"
      - "indie dev"
      - "indie artist"
      - "vtuber designer"
      - "oc creator"
      - "original character"
    ja:
      - "絵師"
      - "イラストレーター"
    zh:
      - "画师"
      - "插画师"
      - "原画师"
      - "概念艺术家"
      - "角色设计师"
      - "毛绒设计师"
      - "同人艺术家"
      - "独立游戏画师"

  action_keywords:
    en:
      - "commission open"
      - "comm open"
      - "preorder"
      - "preorder open"
      - "pre-order"
      - "shop now"
      - "new drop"
      - "merch"
      - "limited"
      - "drop"
      - "my shop"
    zh:
      - "接稿"
      - "开预售"
      - "众筹"
      - "贩售"
      - "定制"
      - "商品化"

  weak_signals:
    - "OC"
    - "original character"
    - "fanart"
    - "doujin"
    - "VTuber"
    - "Repost OK"
    - "RT OK"
    - "shop"
    - "store"
    - "work"
    - "work email"
    - "business inquiry"

  tool_keywords:
    - "Procreate"
    - "Clip Studio"
    - "CSP"
    - "Photoshop"
    - "Blender"
    - "Live2D"
    - "Wacom"
    - "SAI"
    - "saipaint"
    - "Unity"
    - "Unreal"

# === Emoji 信号 ===
emoji_signals:
  creative:   ["🎨", "🖌️", "✍️", "📝"]
  character:  ["🐰", "🦊", "🐱", "🐻", "🌸", "✨", "⭐"]
  commerce:   ["🛍️", "💰", "🛒", "📦"]
  craft:      ["🔨", "🛠️"]
  plush:      ["🧸", "🐻", "🔨", "🛠️"]
  engagement: ["❤️", "💕", "🔥", "💥"]

# === 误杀防范 ===
false_positive_rules:
  fan_account_signals:
    - "fan account"
    - "fan page"
    - "stan account"
  studio_flag:
    signals: ["team", "studio", "agency", " we "]
    counter_signals: [" i ", " my ", " me "]

# === 创作者类型标签 (6 类 type_tags → 最终映射 6 种类型) ===
type_tags:
  OC_Creator:          ["OC", "original character", "my OC", "OC art", "oc creator"]
  VTuber:              ["VTuber", "virtual youtuber", "虚拟主播", "Live2D"]
  Fan_Second_Creation: ["fanart", "doujin", "二次创作", "同人", "fanartist"]
  Game_Studio:         ["indie game", "game dev", "indie studio", "gamedev"]
  Virtual_IP:          ["virtual idol", "virtual IP", "バーチャル", "Vtuber mama"]
  Plush_Merch:         ["plush", "plushie", "ぬいぐるみ", "doll maker", "toys"]

# type_tags → 最终 creator_type 映射
type_tag_mapping:
  OC_Creator: "oc_creator"
  VTuber: "vtuber"
  Fan_Second_Creation: "fan_artist"
  Game_Studio: "game_creator"
  Virtual_IP: "vtuber"
  Plush_Merch: "oc_creator"

# === 置信度阈值 ===
confidence_threshold:
  high: 0.95
  medium: 0.75

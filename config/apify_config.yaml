# Apify Actor 配置
# Actor ID 和参数模板，handles / twitterHandles 由代码动态填入
# 验证日期: 2026-03-28  Token: dulcet_peeler (Starter plan)

following_actor:
  # apidojo/twitter-user-scraper — 支持 profiles / followers / following
  # 付费: $0.016/following query + $0.0004/user (首页 ~70 人免费)
  actor_id: "apidojo/twitter-user-scraper"
  input:
    twitterHandles: []
    getFollowing: true
    getFollowers: false
    maxItems: 500

profile_actor:
  # apidojo/tweet-scraper — Tweet Scraper V2, 抓推文+profile
  # maxItems 需按 handles数 × 每人期望推文数 设置
  actor_id: "apidojo/tweet-scraper"
  input:
    twitterHandles: []
    maxItems: 500

followers_actor:
  # 与 following_actor 同一 Actor，切换 getFollowers 标志
  actor_id: "apidojo/twitter-user-scraper"
  input:
    twitterHandles: []
    getFollowers: true
    getFollowing: false
    maxItems: 1000

# ------------------------------------------------------------------
# DNA Actor：用于抓取种子/BD interested 创作者的详细推文，供 SPS 模型使用
# 比 profile_actor 更深，默认每人抓取 100 条推文
# ------------------------------------------------------------------
dna_actor:
  actor_id: "apidojo/tweet-scraper"
  input:
    twitterHandles: []
    maxItems: 2000
    includeReplies: true
    includeRetweets: true

# ------------------------------------------------------------------
# 备选 Actor 配置（实验性，用于降低 Apify 费用）
# 通过环境变量 APIFY_L1_ACTOR=alt / APIFY_L2_ACTOR=alt 切换
# 注意：以下输入参数为示例，需根据所选 Actor 的实际文档调整
# ------------------------------------------------------------------
alt_following_actor:
  # 示例：get-leads/all-in-one-x-scraper（following 模式，约 $0.20/1K results）
  # 或 automation-lab/twitter-scraper（following 模式，$0.00115/user）
  actor_id: "get-leads/all-in-one-x-scraper"
  input:
    mode: "following"
    usernames: []
    maxResults: 500

alt_profile_actor:
  # 示例：get-leads/all-in-one-x-scraper（user-tweets 模式）
  # 注意：maxResults 的语义因 Actor 而异（全局 vs per-user），请在实际测试后校准
  actor_id: "get-leads/all-in-one-x-scraper"
  input:
    mode: "user-tweets"
    usernames: []
    maxResults: 10

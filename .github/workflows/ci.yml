name: CI

on:
  push:
    branches: [ "main", "feature/**", "fix/**", "hotfix/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: miner
          POSTGRES_PASSWORD: password
          POSTGRES_DB: craftifyx_miner
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Initialize test database schema
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U miner -d craftifyx_miner -f db/schema.sql
          psql -h localhost -U miner -d craftifyx_miner -f db/indexes.sql

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://miner:password@localhost:5432/craftifyx_miner
          FLASK_SECRET_KEY: ci-test-secret
          JWT_SECRET_KEY: ci-test-jwt-secret
        run: |
          pytest tests/ -q --tb=short
